# Publishes Docker images from the monorepo root:
# - API-only (docker/Dockerfile) → ghcr.io/elidune/elidune-server (main only)
# - UI (docker/Dockerfile.ui) → ghcr.io/elidune/elidune-ui (main only)
# - All-in-one (docker/Dockerfile.all-in-one) → ghcr.io/elidune/elidune-all-in-one (main + dev)
#
# Tags: :latest on main, :dev on the dev branch, plus :<git-sha> on both.
# Pushes from dev never overwrite :latest.
name: Build & Push Docker Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'server/**'
      - 'ui/**'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'

# Batched merges push dev several times in a row; only the last :dev matters.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

env:
  REGISTRY: ghcr.io

jobs:
  build-split-images:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: docker/Dockerfile
            image: ghcr.io/elidune/elidune-server
          - dockerfile: docker/Dockerfile.ui
            image: ghcr.io/elidune/elidune-ui
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}

  build-all-in-one:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/elidune/elidune-all-in-one
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=dev,enable=${{ github.ref_name == 'dev' }}
            type=raw,value=${{ github.sha }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.all-in-one
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=docker/Dockerfile.all-in-one
          cache-to: type=gha,mode=max,scope=docker/Dockerfile.all-in-one
