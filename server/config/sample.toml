# Elidune Server Configuration

[server]
host = "0.0.0.0"
port = 8080
# Reverse proxies that may set X-Forwarded-For / X-Real-IP / Forwarded.
# Comma-separated CIDRs. Unset: those headers are ignored and the TCP peer is the client.
# Env: ELIDUNE_SERVER__TRUSTED_PROXIES=127.0.0.1/32,::1/128
# trusted_proxies = "127.0.0.1/32, ::1/128"
#
# Quotas are requests per minute (plus a burst), not tower_governor's "one token every N seconds".
# Strict per-IP cap for login, 2FA, password reset, and first setup. Default 30/min, burst 30
# (several desks behind one NAT).
# auth_ip_per_minute = 30
# auth_ip_burst = 30
# Per login/email: 5 failed sign-ins per 15 minutes. Password-reset requests do
# not use this counter. Temporary block, not an account lockout.
# Staff clear it with DELETE /api/v1/auth/rate-limit/{login} (librarian/admin, users write).
# auth_identifier_max_failures = 5
# auth_identifier_window_secs = 900
# Password-reset requests: 3 per hour per login/email, on top of the per-IP cap.
# Over the quota the API still returns the generic 200 and sends no mail.
# auth_password_reset_max = 3
# auth_password_reset_window_secs = 3600
# Authenticated /auth/me, /auth/profile, … keyed by user id. Not the strict IP cap.
# auth_session_per_minute = 120
# auth_session_burst = 60
# Public OPAC, covers, library-info GET.
# public_per_minute = 600
# public_burst = 120
# Public UI origin for links in outbound email. No trailing slash.
# Announcements link to {public_base_url}/events/unsubscribe?token=…
# List-Unsubscribe uses {public_base_url}/api/v1/events/unsubscribe?token=…
# When unset, both use http://{host}:{port} (0.0.0.0 and :: become localhost).
# public_base_url = "https://library.example.org"

[database]
url = "postgres://elidune:elidune@localhost:5432/elidune"
max_connections = 10
min_connections = 2

[users]
jwt_secret = "change-this-secret-in-production"
jwt_expiration_hours = 24
# Optional admin override for password-reset links. Client `resetUrl` is ignored.
# Must contain the literal `<token>` placeholder. When unset, the server uses
# {PUBLIC_BASE_URL}/reset-password?token=<token>.
# password_reset_url_template = "https://library.example.org/reset-password?token=<token>"

[logging]
level = "debug"
format = "pretty"       # "pretty" | "plain" | "json"
output = "stdout"       # "stdout" | "stderr" | "file" | "syslog"
# file_path = "logs/elidune.log"   # required when output = "file"
# file_rotation = "daily"          # "monthly" | "weekly" | "daily" | "never" (default: daily)
overridable = true

[email]
smtp_host = ""
smtp_port = 587
smtp_username = ""
smtp_password = ""
smtp_from = ""
smtp_from_name = "Elidune"
smtp_use_tls = true
# templates_dir = "data/email_templates"  # optional, default
overridable = true

[redis]
url = "redis://127.0.0.1:6379"
z3950_cache_ttl_seconds = 604800  # 7 days in seconds


[reminders]
enabled = true
frequency_days = 7      # Legacy: kept for existing admin-config payloads
first_reminder_delay_days = 7       # Days after due date before 1st reminder
second_reminder_delay_days = 14     # Days after due date before 2nd reminder
formal_notice_delay_days = 21       # Days after due date before formal notice
first_reminder_template = "overdue_reminder"
second_reminder_template = "overdue_second_reminder"
formal_notice_template = "overdue_formal_notice"
first_reminder_enabled = true
second_reminder_enabled = true
formal_notice_enabled = true
send_time = "09:00"     # HH:MM (24h) when the scheduler sends reminders
accrue_fines = true     # Nightly overdue fine accrual (idempotent, one open fine per loan)
smtp_throttle_ms = 100  # Delay between individual emails (ms)
overridable = true

[audit]
retention_days = 365    # Audit log entries older than this are deleted automatically
overridable = true

[holds]
ready_expiry_days = 7   # Days to pick up a hold after it becomes "ready" (drives expires_at)
overridable = true

[circulation]
skip_closed_days = true  # Push checkout/renew due dates to the next open day
overridable = true

# Patron personal-data retention (RGPD). Desk delete = “anonymize for stats”.
# 0 disables the daily 04:00 job. A typical public-library value is 3 years after expiry_at.
[privacy]
auto_anonymize_years_after_expiry = 0

[meilisearch]
url = "http://localhost:7700"
api_key = "changeme"           # optional — omit if running without auth
index_name = "items"           # default: "items"